name: Update

on:
  workflow_dispatch:
  schedule:
    # “At 00:00 on Sunday.” https://crontab.guru/#0_0_*_*_0
    - cron: "0 0 * * 0"

jobs:
  update:
    if: github.event_name != 'schedule' || github.repository == 'sindresorhus/builtin-modules'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          check-latest: true
          node-version: latest
      - run: node make.js --incremental
      - run: |
          echo "CURRENT_DATE=$(date +'%Y-%m-%d')" >> "$GITHUB_ENV"
          echo "NODE_VERSION=$(node --version)" >> "$GITHUB_ENV"
      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: Add Node.js ${{ env.NODE_VERSION }} modules
          branch: automated-update-${{ env.CURRENT_DATE }}
          branch-suffix: timestamp
          title: Add Node.js ${{ env.NODE_VERSION }} modules
